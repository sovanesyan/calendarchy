<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Calendarchy">
<title>Calendarchy</title>
<meta name="theme-color" content="#17181d">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<!--
  Calendarchy on the phone (calendarchy serve serves it): the shell window's
  layout for a touch screen. /api/agenda is the same JSON `calendarchy --agenda`
  prints; /layout.js is the window's own display rules (shell/window/Layout.js:
  gaps, current/next, busy time), so the two can't drift. Dressed in the
  kit (kit.css, theme.js from ~/Work/rb/ghostwheel/kit). Plain JS, no network but
  our own /api.

  One view, the day. A sticky bar with the day, Today, refetch and the week strip
  (‹ › or a swipe on it moves a week); then today's now/next card, all-day chips
  and the day as a timeline (hours down the side, Work blue and Personal orange as
  blocks by their times, side by side where they overlap, free time left empty
  with a label, a line at now). An event in both calendars is drawn once, with a
  dot for each. Light or dark follows the phone.
  Tap an event for its details, Join, Accept or Decline. Swipe sideways for the
  next day; pull down to refetch from Google and iCloud.
-->
<link rel="stylesheet" href="/kit.css">
<style>
  /* Work and Personal own one hue each, and nothing else uses them. State is shape: the now
     line, a "next" tag, faded past, dashed not-accepted. Green is for now and Join */
  :root{--work:#2f6fdc;--personal:#d4731f}
  :root[data-scheme=dark]{--work:#6f9cf2;--personal:#f0a058}
  body{min-height:100vh;min-height:100dvh;padding-bottom:var(--safe-b)}
  @media (hover:hover){a:hover{text-decoration:underline}}

  /* the sticky bar: the day, Today, refetch, and the week strip */
  header{position:sticky;top:0;z-index:5;display:block;padding:calc(.5rem + env(safe-area-inset-top,0px)) calc(.8rem + var(--safe-r)) .35rem calc(.8rem + var(--safe-l))}
  header .row{display:flex;align-items:center;gap:.5rem;max-width:760px;margin:0 auto;padding:0 .2rem}
  header .title{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
  header .title b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .title small{font-size:11.5px;color:var(--dim)}
  .pill{appearance:none;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;height:32px;padding:0 .9rem;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
  .pill[hidden]{display:none}
  .refresh{appearance:none;border:1px solid var(--line);background:transparent;border-radius:999px;width:32px;height:32px;display:grid;place-items:center;cursor:pointer;flex:none;color:var(--fg)}
  .refresh svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
  .refresh.spin svg{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (pointer:coarse){.refresh{width:40px;height:40px}.pill{height:40px}}

  .strip{display:flex;align-items:center;gap:2px;max-width:760px;margin:.35rem auto 0}
  .wk{appearance:none;border:0;background:transparent;color:var(--muted);font-size:18px;width:24px;height:44px;cursor:pointer;flex:none;padding:0}
  .week{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .wd{appearance:none;border:0;background:transparent;border-radius:10px;padding:.25rem 0 .3rem;min-height:48px;cursor:pointer;color:var(--fg);display:flex;flex-direction:column;align-items:center;gap:2px}
  .wd small{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .wd b{font-size:15px;font-variant-numeric:tabular-nums}
  .wd i{display:block;width:60%;height:3px;border-radius:2px;background:var(--chip);overflow:hidden}
  .wd i span{display:block;height:100%;background:var(--muted)}
  .wd i span.heavy{background:var(--warn)}
  .wd.today b{color:var(--accent)}
  .wd.sel{background:var(--accent);color:var(--on-accent)}
  .wd.sel b,.wd.sel small{color:var(--on-accent)}
  .wd.sel i{background:color-mix(in srgb,var(--on-accent) 25%,transparent)}
  .wd.sel i span{background:var(--on-accent)}
  .wd.weekend small{color:var(--dim)}

  /* the day before, the day and the day after, a screen each, in the browser's own sideways
     scroller (app.js go/settled): it follows the finger at the screen's rate and snaps a day at
     a time. Its height is set to the day's (centre), and vertical scrolling stays the page's */
  .days{display:flex;align-items:flex-start;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;
    overscroll-behavior-x:contain;scrollbar-width:none}
  .days::-webkit-scrollbar{display:none}
  .pane{flex:0 0 100%;min-width:0;scroll-snap-align:start;scroll-snap-stop:always}
  main{max-width:760px;margin:0 auto;padding:0 var(--safe-r) 1.5rem var(--safe-l)}

  .toast{position:fixed;z-index:20;left:50%;bottom:calc(var(--safe-b) + 14px);transform:translate(-50%,20px);opacity:0;pointer-events:none;
    max-width:calc(100% - 2rem);padding:.45rem .9rem;border-radius:999px;background:var(--fg);color:var(--bg);font-size:12.5px;
    box-shadow:0 4px 14px rgba(0,0,0,.2);transition:opacity .18s,transform .18s}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .toast.bad{background:var(--urgent);color:#fff}

  /* now / next */
  .upnext{display:flex;align-items:center;gap:.7rem;margin:.6rem 1rem .2rem;padding:.6rem .8rem;border-radius:12px;background:var(--surface);border:1px solid var(--line);cursor:pointer}
  .upnext.now{border-color:color-mix(in srgb,var(--good) 55%,transparent);background:color-mix(in srgb,var(--good) 10%,transparent)}
  .upnext .k{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
  .upnext .t{font-family:var(--sans);font-size:15px;font-weight:600;overflow-wrap:anywhere}
  .upnext .w{color:var(--dim);font-size:12.5px}
  .upnext .grow{flex:1;min-width:0}
  .join{appearance:none;border:0;border-radius:9px;background:var(--good);color:var(--on-accent);font-weight:700;padding:0 .9rem;height:36px;display:inline-flex;align-items:center;cursor:pointer;flex:none;font-size:13px}
  a.join:hover{text-decoration:none}

  /* only on an event that's in both calendars */
  .srcs{display:inline-flex;gap:3px;align-self:center;margin-right:.3rem;vertical-align:1px}
  .srcs i{width:7px;height:7px;border-radius:50%;background:var(--work)}
  .srcs i.icloud{background:var(--personal)}

  /* all-day events */
  .chips{display:flex;flex-wrap:wrap;gap:.35rem;padding:.6rem 1rem .1rem}
  /* events are soft islands: the calendar's colour is in a light fill and the title's shade, no bar */
  .chip{appearance:none;border:0;border-radius:11px;background:color-mix(in srgb,var(--work) 15%,var(--bg));color:color-mix(in srgb,var(--work) 72%,var(--fg));
    font-family:var(--sans);font-size:13px;font-weight:600;padding:.4rem .8rem;min-height:36px;cursor:pointer;text-align:left;max-width:100%}
  .chip.icloud{background:color-mix(in srgb,var(--personal) 17%,var(--bg));color:color-mix(in srgb,var(--personal) 72%,var(--fg))}
  .chip.both{background:linear-gradient(105deg,color-mix(in srgb,var(--work) 15%,var(--bg)) 55%,color-mix(in srgb,var(--personal) 20%,var(--bg)) 55%)}
  .chip.unaccepted{background:transparent;border:1.5px dashed color-mix(in srgb,var(--work) 55%,transparent);font-style:italic;color:var(--dim)}
  .chip.unaccepted.icloud{border-color:color-mix(in srgb,var(--personal) 55%,transparent)}
  .chip small{font-weight:400;color:var(--dim)}

  /* the timeline */
  .tl{position:relative;margin:1rem 1rem 1.5rem 0}
  .tl .hr{position:absolute;left:2.9rem;right:0;border-top:1px solid var(--line)}
  .tl .hr.half{border-top-style:dotted;opacity:.5}
  .tl .hr span{position:absolute;left:-2.9rem;width:2.4rem;top:-.6em;text-align:right;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .tl .work{position:absolute;left:2.9rem;right:0;background:var(--surface)}
  .tl .area{position:absolute;top:0;bottom:0;left:2.9rem;right:0}
  .blk{position:absolute;appearance:none;border:0;margin:0;text-align:left;cursor:pointer;overflow:hidden;color:color-mix(in srgb,var(--work) 72%,var(--fg));
    border-radius:11px;padding:5px 10px 3px;display:flex;flex-direction:column;z-index:2;background:color-mix(in srgb,var(--work) 15%,var(--bg));
    transition:transform .08s ease,filter .08s ease;-webkit-tap-highlight-color:transparent}
  .blk.icloud{background:color-mix(in srgb,var(--personal) 17%,var(--bg));color:color-mix(in srgb,var(--personal) 72%,var(--fg))}
  .blk.both{background:linear-gradient(105deg,color-mix(in srgb,var(--work) 15%,var(--bg)) 55%,color-mix(in srgb,var(--personal) 20%,var(--bg)) 55%)}
  .blk .t{font-family:var(--sans);font-size:13px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
  .blk .nx{display:inline-block;margin-right:.35rem;padding:0 .3rem;border-radius:4px;background:color-mix(in srgb,var(--work) 72%,var(--fg));color:var(--bg);font-family:var(--mono);
    font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;vertical-align:1px}
  .blk.icloud .nx{background:color-mix(in srgb,var(--personal) 72%,var(--fg))}
  .blk.short,.blk.narrow{justify-content:center;padding-top:0;padding-bottom:0}
  .blk.short .t,.blk.narrow .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .blk.narrow{justify-content:flex-start;padding-top:5px}
  .blk.past{opacity:.45}
  .blk.unaccepted{background:var(--bg);border:1.5px dashed color-mix(in srgb,var(--work) 55%,transparent)}
  .blk.unaccepted.icloud{border-color:color-mix(in srgb,var(--personal) 55%,transparent)}
  .blk.unaccepted .t{font-style:italic;font-weight:500;color:var(--dim)}
  .blk.freeev{background:transparent;border:1.5px solid color-mix(in srgb,var(--work) 40%,transparent)}
  .blk.freeev.icloud{border-color:color-mix(in srgb,var(--personal) 40%,transparent)}
  .blk:active,.chip:active{transform:scale(.985);filter:brightness(.92)}
  @media (hover:hover){.blk:hover{filter:brightness(.97)}}
  .free{position:absolute;right:6px;z-index:1;color:var(--muted);font-size:11px;font-style:italic;line-height:16px;pointer-events:none}
  .free.now{color:var(--good);font-style:normal;font-weight:700}
  .nowline{position:absolute;left:2.1rem;right:0;border-top:2px solid var(--urgent);z-index:3;pointer-events:none}
  .nowline::before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--urgent)}
  .none{margin:1.2rem 1rem;padding:1rem;border-radius:12px;background:var(--surface);color:var(--dim);font-size:13px;text-align:center}
  .none small{display:block;margin-top:.3rem;color:var(--fg);font-family:var(--sans);font-size:13.5px}

  .msg{margin:.6rem 1rem;padding:.5rem .7rem;border-radius:9px;font-size:12.5px;background:var(--chip);color:var(--dim)}
  .msg.bad{color:var(--urgent);background:color-mix(in srgb,var(--urgent) 10%,transparent)}

  /* the event's sheet: the kit's sheet, with details in it */
  .kit-sheet-box{max-height:85vh;max-height:85dvh;overflow-y:auto}
  .dt{padding:0 .2rem}
  .dt .when{color:var(--dim);font-size:12.5px;margin:.1rem 0 .5rem}
  .dt .when .srcs{margin-right:.4rem;vertical-align:1px}
  .dt .same{color:var(--muted);font-size:12px;margin:-.3rem 0 .5rem}
  .dt .acts{display:flex;flex-wrap:wrap;gap:.4rem;margin:.2rem 0 .6rem}
  .dt .acts .btn,.dt .acts .join{height:40px;padding:0 .9rem;font-size:13.5px}
  .dt .acts .btn.ok{color:var(--good)}
  .dt .lab{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:.7rem 0 .25rem}
  .dt .txt{font-family:var(--sans);font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--fg)}
  .dt .who{font-family:var(--sans);font-size:13px;display:flex;gap:.45rem;padding:.12rem 0}
  .dt .who .st{width:1.1rem;text-align:center;color:var(--muted);flex:none}
  .dt .who .st.accepted,.dt .who .st.organizer{color:var(--good)}
  .dt .who .st.declined{color:var(--urgent)}
  .dt .who .st.tentative{color:var(--warn)}
  .dt .who .nm{overflow-wrap:anywhere}
  .dt .who small{color:var(--muted)}
  .dt .note{color:var(--warn);font-size:12.5px;margin-bottom:.4rem}

  @media (min-width:700px){
    body{font-size:15px}
  }
</style>
</head>
<body>
<header>
  <div class="row">
    <div class="title" id="title"></div>
    <button class="pill" id="today" type="button" hidden>Today</button>
    <button class="refresh" id="refresh" type="button" aria-label="Refetch from Google and iCloud" title="Refetch from Google and iCloud"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button>
  </div>
  <div class="strip" id="strip">
    <button class="wk" id="prevwk" type="button" aria-label="Previous week">‹</button>
    <div class="week" id="week"></div>
    <button class="wk" id="nextwk" type="button" aria-label="Next week">›</button>
  </div>
</header>

<div class="days" id="days">
  <div class="pane"><main id="before" inert></main></div>
  <div class="pane"><main id="main"><div class="empty">Loading…</div></main></div>
  <div class="pane"><main id="after" inert></main></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/theme.js"></script>
<script src="/layout.js"></script>
<script src="/app.js?v=12"></script>
</body>
</html>
