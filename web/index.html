<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Calendarchy">
<title>Calendarchy</title>
<meta name="theme-color" content="#1a1b26">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<!--
  Calendarchy on the phone (calendarchy serve serves it): the shell window's
  layout for a touch screen. /api/agenda is the same JSON `calendarchy --agenda`
  prints; /layout.js is the window's own display rules (shell/window/Layout.js:
  gaps, current/next, busy time), so the two can't drift. Dressed in the
  kit (kit.css, theme.js from ~/Work/rb/ghostwheel/kit). Plain JS, no network but
  our own /api.

  One view, the day: the week strip, now/next, then Work and Personal as one
  list with free gaps (an event in both calendars once, a dot for each).
  Tap an event for its details, Join, Accept or Decline. Swipe sideways for the
  next day; pull down to refetch from Google and iCloud.
-->
<link rel="stylesheet" href="/kit.css">
<style>
  :root{--work:var(--accent);--personal:var(--good)}
  body{min-height:100vh;min-height:100dvh;padding-bottom:var(--safe-b)}
  @media (hover:hover){a:hover{text-decoration:underline}}

  header{position:sticky;top:0;z-index:5;padding:calc(.55rem + env(safe-area-inset-top,0px)) calc(1rem + var(--safe-r)) .55rem calc(1rem + var(--safe-l))}
  header .brand svg{flex:none}
  header .tally b{color:var(--fg)}
  header .tally .soon{color:var(--warn);font-weight:600}
  .refresh{appearance:none;border:1px solid var(--line);background:transparent;border-radius:8px;width:32px;height:30px;display:grid;place-items:center;cursor:pointer;flex:none;color:var(--fg)}
  .refresh svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
  .refresh.spin svg{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (pointer:coarse){.refresh{width:44px;height:40px}}

  main{max-width:760px;margin:0 auto;padding:0 var(--safe-r) 1.5rem var(--safe-l)}
  .sect > .r{margin-left:auto;display:flex;gap:.35rem;text-transform:none;letter-spacing:0}
  .nav{appearance:none;border:1px solid var(--line);background:transparent;border-radius:8px;min-width:32px;height:30px;padding:0 .55rem;font-size:13px;cursor:pointer;color:var(--fg)}
  @media (pointer:coarse){.nav{min-width:42px;height:36px;font-size:14px}}
  .sect.big{font-size:13px;color:var(--fg);text-transform:none;letter-spacing:0;font-weight:700;align-items:center}

  /* the week strip */
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:.7rem .8rem .2rem}
  .wd{appearance:none;border:1px solid transparent;background:transparent;border-radius:10px;padding:.3rem 0 .35rem;cursor:pointer;color:var(--fg);display:flex;flex-direction:column;align-items:center;gap:2px}
  .wd small{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .wd b{font-size:15px;font-variant-numeric:tabular-nums}
  .wd i{display:block;width:70%;height:4px;border-radius:2px;background:var(--chip);overflow:hidden}
  .wd i span{display:block;height:100%;background:var(--work)}
  .wd i span.heavy{background:var(--warn)}
  .wd.today b{color:var(--accent)}
  .wd.sel{background:var(--sel);border-color:var(--accent)}
  .wd.weekend small{color:var(--dim)}

  /* now / next */
  .upnext{display:flex;align-items:center;gap:.7rem;margin:.6rem 1rem .2rem;padding:.6rem .8rem;border-radius:12px;background:var(--surface);border:1px solid var(--line);cursor:pointer}
  .upnext.now{border-color:color-mix(in srgb,var(--good) 55%,transparent);background:color-mix(in srgb,var(--good) 10%,transparent)}
  .upnext .k{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
  .upnext .t{font-family:var(--sans);font-size:15px;font-weight:600;overflow-wrap:anywhere}
  .upnext .w{color:var(--dim);font-size:12.5px}
  .upnext .grow{flex:1;min-width:0}
  .join{appearance:none;border:0;border-radius:9px;background:var(--good);color:var(--on-accent);font-weight:700;padding:0 .9rem;height:36px;display:inline-flex;align-items:center;cursor:pointer;flex:none;font-size:13px}
  a.join:hover{text-decoration:none}

  /* Work | Personal */
  .list{margin-top:.3rem}
  .ev{display:block;width:100%;text-align:left;appearance:none;border:0;background:transparent;color:inherit;font:inherit;cursor:pointer;
    padding:.4rem .7rem .45rem .65rem;border-left:3px solid color-mix(in srgb,var(--work) 70%,transparent)}
  .ev.icloud{border-left-color:color-mix(in srgb,var(--personal) 70%,transparent)}
  .ev.both{border-image:linear-gradient(var(--work) 50%,var(--personal) 50%) 1}
  .srcs{display:inline-flex;gap:3px;align-self:center}
  .srcs i{width:7px;height:7px;border-radius:50%;background:var(--work)}
  .srcs i.icloud{background:var(--personal)}
  .ev .tm{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;column-gap:.4rem;align-items:baseline}
  .ev .tm .at{white-space:nowrap}
  .ev .tm .kind{margin-left:auto;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .ev .ti{font-family:var(--sans);font-size:14px;line-height:1.3;overflow-wrap:anywhere;margin-top:1px}
  .ev.allday .ti{font-weight:600}
  .ev.past{opacity:.45}
  .ev.current{background:color-mix(in srgb,var(--good) 12%,transparent);border-left-color:var(--good)}
  .ev.next{background:var(--sel);border-left-color:var(--accent)}
  .ev.unaccepted .ti{color:var(--dim);font-style:italic}
  .ev.unaccepted{border-left-style:dashed}
  .ev.free .ti{color:var(--dim)}
  .ev .tm .clash{color:var(--warn);font-size:10.5px;white-space:nowrap}
  @media (hover:hover){.ev:hover{background:var(--chip)}}
  .gap{padding:.25rem .7rem .3rem .9rem;font-size:12px;color:var(--muted);font-style:italic}
  .gap.now{color:var(--good);font-weight:600;font-style:normal}
  .none{padding:.4rem .8rem;color:var(--muted);font-size:12.5px}
  .none small{display:block;margin-top:.15rem;color:var(--dim);font-family:var(--sans);font-size:12.5px}

  .msg{margin:.6rem 1rem;padding:.5rem .7rem;border-radius:9px;font-size:12.5px;background:var(--chip);color:var(--dim)}
  .msg.bad{color:var(--urgent);background:color-mix(in srgb,var(--urgent) 10%,transparent)}

  /* the event's sheet: the kit's sheet, with details in it */
  .kit-sheet-box{max-height:85vh;max-height:85dvh;overflow-y:auto}
  .dt{padding:0 .2rem}
  .dt .when{color:var(--dim);font-size:12.5px;margin:.1rem 0 .5rem}
  .dt .when .srcs{margin-right:.4rem;vertical-align:1px}
  .dt .same{color:var(--muted);font-size:12px;margin:-.3rem 0 .5rem}
  .dt .acts{display:flex;flex-wrap:wrap;gap:.4rem;margin:.2rem 0 .6rem}
  .dt .acts .btn,.dt .acts .join{height:40px;padding:0 .9rem;font-size:13.5px}
  .dt .acts .btn.ok{color:var(--good)}
  .dt .lab{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:.7rem 0 .25rem}
  .dt .txt{font-family:var(--sans);font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--fg)}
  .dt .who{font-family:var(--sans);font-size:13px;display:flex;gap:.45rem;padding:.12rem 0}
  .dt .who .st{width:1.1rem;text-align:center;color:var(--muted);flex:none}
  .dt .who .st.accepted,.dt .who .st.organizer{color:var(--good)}
  .dt .who .st.declined{color:var(--urgent)}
  .dt .who .st.tentative{color:var(--warn)}
  .dt .who .nm{overflow-wrap:anywhere}
  .dt .who small{color:var(--muted)}
  .dt .note{color:var(--warn);font-size:12.5px;margin-bottom:.4rem}

  @media (min-width:700px){
    body{font-size:15px}
    .ev .ti{font-size:15px}
  }
</style>
</head>
<body>
<header>
  <span class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="6" width="26" height="23" rx="3" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M3 13h26M10.5 3v6M21.5 3v6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>Calendarchy</span>
  <span class="tally" id="tally"></span>
  <button class="refresh" id="refresh" type="button" aria-label="Refetch from Google and iCloud" title="Refetch from Google and iCloud"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button>
</header>

<main id="main"><div class="empty">Loading…</div></main>

<script src="/theme.js"></script>
<script src="/layout.js"></script>
<script src="/app.js?v=3"></script>
</body>
</html>
